# T10 handshake benchmark: configurations A and B, interleaved (A, B, A, B, ...)
# so slow drift in load or temperature hits both equally.
# Plain key=value lines. Edit this file, never the code, to change an experiment.
name=t10_handshake_loopback
configs=A,B
group_A=X25519
group_B=X25519MLKEM768
cipher_suite=TLS_AES_128_GCM_SHA256
tls_min_max_version=1.3
hostname=relay.test
loss_percent=0
loss_method=none
# Successful, non-warm-up handshakes required per configuration (T10: at least 100).
repetitions=100
# Successful handshakes per configuration that are run first and excluded from statistics.
warmup=5
# Hard cap on attempts so a broken setup cannot loop forever.
max_attempts=500
timeout_ms=5000
# Pause between attempts in milliseconds (0 = none).
interval_ms=0
