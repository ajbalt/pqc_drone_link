# T08 packet-loss runs at the size the spec asks for (docs/telemetry_format.md section 7):
# 10 minutes at 10 Hz per run, 10 repetitions, A and B at 0, 10 and 30% loss. About 11 hours.
# Same format as t08_loss_loopback.conf, which is the 3-minute dev-sized version.
# Plain key=value lines. Edit this file, never the code, to change an experiment.
name=t08_loss_full
configs=A,B
cipher_suite=TLS_AES_128_GCM_SHA256
hostname=relay.test
# Emulated loss in percent, applied to every packet on the interface, in both directions.
loss_percent_list=0,10,30
# Extra one-way delay in ms (0 = none) and the interface MTU. 1500 makes loopback split
# messages into packets as Ethernet and Wi-Fi do, so a larger handshake spans more packets.
delay_ms=0
mtu=1500
loss_method=tc netem on lo inside an unprivileged user and network namespace (unshare -Urn)
# Runs per (configuration, loss level) and the number the spec asks for before a result is
# reportable (docs/telemetry_format.md section 7).
repetitions=10
min_runs=10
# Records made per run and how fast, then the queue and the link settings.
records=6000
rate_hz=10
queue_capacity=10000
window=32
timeout_ms=2000
server_timeout_ms=5000
backoff_ms=100
backoff_max_ms=1000
# A run that has not delivered everything by then is reported as undelivered, not hidden.
run_deadline_s=1800
